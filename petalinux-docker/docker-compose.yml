services:
  petalinux-builder:
    image: petalinux-builder:22.04
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /opt/Xilinx/Projects:/home/builder/workspace
      - /opt/Xilinx/petalinux/:/home/builder/petalinux
      - /opt/Xilinx/petalinux-cache/downloads:/home/builder/downloads
      - /opt/Xilinx/petalinux-cache/sstate:/home/builder/sstate
